<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Search</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-wrapper">
        <header>
            <h1>Change Management Word Search</h1>
            <p>Find the 10 ITIL terms hiding in the grid. They can run in any direction, even backwards!</p>
        </header>

        <div class="game-container">
            <div class="grid-section">
                <div id="word-grid" class="word-grid" aria-label="Word search grid">
                    <svg id="grid-overlay" aria-hidden="true"></svg>
                </div>
            </div>

            <div class="right-col">
                <div class="clues-section">
                    <div class="clues-header">
                        <h2>Words to find</h2>
                        <span id="progress-badge" class="progress-badge" aria-live="polite">0 / 10</span>
                    </div>

                    <ul id="clue-list">
                        <!-- Words are generated by JS -->
                    </ul>

                    <button id="hint-btn" class="btn btn-hint" type="button">
                        <span aria-hidden="true">💡</span> Hint <span id="hint-count">(3)</span>
                    </button>
                </div>

                <div id="win-message" class="win-box">
                    <span>🎉 You found every word!</span>
                    <div class="win-buttons">
                        <button id="review-btn" class="btn btn-primary" type="button">Review all words</button>
                        <button id="play-again-win-btn" class="btn btn-secondary" type="button">Play again</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Explanation Modal -->
    <div id="explanation-modal" class="modal-overlay">
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modal-word">
            <h2 id="modal-word">WORD</h2>
            <div class="modal-body">
                <p id="modal-definition" class="definition-text"></p>
                <div class="quick-fact-box">
                    <span class="quick-fact-label">💡 Quick fact</span>
                    <p id="modal-quick-fact"></p>
                </div>
            </div>
            <button id="modal-btn" class="btn btn-primary" type="button">Got it</button>
        </div>
    </div>

    <!-- Summary Page -->
    <div id="summary-page" class="full-page-modal hidden">
        <div class="summary-content">
            <header class="summary-header">
                <h2>Revision summary</h2>
                <p>All 10 Change Management concepts</p>
            </header>
            <div id="summary-list" class="summary-list">
                <!-- Cards injected by JS -->
            </div>
            <div class="sticky-bottom">
                <button id="close-summary-btn" class="btn btn-primary" type="button">Back to game</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
